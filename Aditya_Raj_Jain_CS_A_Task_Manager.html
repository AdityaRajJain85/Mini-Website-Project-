<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager | Aditya Raj Jain</title>
<style>
:root{--bg:#0b0d17;--surface:#141729;--text:#e8eaf2;--muted:#9aa0b8;--line:#262a45;--a:#4f8cff;--b:#a56bff;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:32px 16px;line-height:1.5}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.app{max-width:640px;margin:auto}
h1{font-size:1.8rem;margin-bottom:4px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.sub{color:var(--muted);margin-bottom:22px;font-size:.95rem}
form{display:flex;gap:8px;margin-bottom:16px}
input[type=text]{flex:1;min-width:0;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 14px}
button.primary{background:linear-gradient(90deg,var(--a),var(--b));border:0;color:#fff;font-weight:600;padding:12px 18px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.filters{display:flex;gap:6px}
.filters button[aria-pressed=true]{background:var(--a);border-color:var(--a);color:#fff}
.count{color:var(--muted);font-size:.9rem}
ul{list-style:none;display:grid;gap:8px}
li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none}
li .t{flex:1;min-width:0;word-break:break-word}
li.done .t{text-decoration:line-through;color:var(--muted)}
li input.edit{flex:1;min-width:0;padding:8px;border-radius:6px;border:1px solid var(--a);background:var(--bg);color:var(--text);font:inherit}
.acts{display:flex;gap:6px;flex:none}
.acts button{padding:5px 10px;font-size:.85rem}
.acts .del:hover{border-color:var(--bad);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:28px;border:1px dashed var(--line);border-radius:10px}
.msg{color:var(--bad);font-size:.88rem;min-height:1.3em;margin-bottom:6px}
.clear{margin-top:14px;font-size:.88rem;color:var(--muted)}
@media(max-width:480px){li{flex-wrap:wrap}.acts{width:100%;justify-content:flex-end}}
</style>
</head>
<body>
<main class="app">
  <h1>Task Manager</h1>
  <p class="sub">Add tasks, edit them, tick them off. Everything is saved in your browser.</p>

  <form id="add">
    <input type="text" id="new" placeholder="What needs doing?" aria-label="New task" maxlength="120" autocomplete="off">
    <button class="primary" type="submit">Add task</button>
  </form>
  <p class="msg" id="msg" role="alert"></p>

  <div class="bar">
    <div class="filters" role="group" aria-label="Filter tasks">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="active" aria-pressed="false">Active</button>
      <button data-f="done" aria-pressed="false">Completed</button>
    </div>
    <span class="count" id="count"></span>
  </div>

  <ul id="list"></ul>
  <button class="clear" id="clear">Clear completed</button>
</main>

<script>
const KEY='tasks-aditya';
let tasks=[],filter='all',editing=null;
try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}};

function render(){
  const list=$('list');list.innerHTML='';
  const shown=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));
  if(!shown.length){
    const d=document.createElement('li');d.className='empty';d.style.display='block';
    d.textContent=tasks.length?'No '+(filter==='done'?'completed':'active')+' tasks.':'No tasks yet. Add your first one above.';
    list.appendChild(d);
  }
  shown.forEach(t=>{
    const li=document.createElement('li');if(t.done)li.className='done';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;
    cb.setAttribute('aria-label','Mark "'+t.text+'" as completed');
    cb.onchange=()=>{t.done=cb.checked;save();render()};
    li.appendChild(cb);
    const acts=document.createElement('div');acts.className='acts';
    if(editing===t.id){
      const inp=document.createElement('input');inp.type='text';inp.className='edit';inp.value=t.text;inp.maxLength=120;
      const ok=()=>{const v=inp.value.trim();if(!v){inp.focus();return}t.text=v;editing=null;save();render()};
      inp.onkeydown=e=>{if(e.key==='Enter')ok();if(e.key==='Escape'){editing=null;render()}};
      li.appendChild(inp);
      acts.append(btn('Save',ok),btn('Cancel',()=>{editing=null;render()}));
      setTimeout(()=>inp.focus(),0);
    }else{
      const s=document.createElement('span');s.className='t';s.textContent=t.text;li.appendChild(s);
      acts.append(btn('Edit',()=>{editing=t.id;render()}),btn('Delete',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()},'del'));
    }
    li.appendChild(acts);list.appendChild(li);
  });
  const left=tasks.filter(t=>!t.done).length;
  $('count').textContent=left+' task'+(left===1?'':'s')+' left';
  document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===filter));
  $('clear').style.display=tasks.some(t=>t.done)?'':'none';
}
function btn(label,fn,cls){const b=document.createElement('button');b.type='button';b.textContent=label;if(cls)b.className=cls;b.onclick=fn;return b}

$('add').onsubmit=e=>{
  e.preventDefault();const v=$('new').value.trim();
  if(!v){$('msg').textContent='Type a task before adding it.';return}
  if(tasks.some(t=>t.text.toLowerCase()===v.toLowerCase())){$('msg').textContent='That task is already on your list.';return}
  $('msg').textContent='';
  tasks.unshift({id:Date.now(),text:v,done:false});save();$('new').value='';render();
};
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
$('clear').onclick=()=>{tasks=tasks.filter(t=>!t.done);save();render()};
render();
</script>
</body>
</html>
